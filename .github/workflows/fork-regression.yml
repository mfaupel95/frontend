name: Fork regression
on:
  pull_request:
    branches: [dev]
  push:
    branches: [hermes/final-B-ci-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group-by-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max_old_space_size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate typecheck resources
        run: pnpm exec gulp gen-icons-json build-translations build-locale-data gather-gallery-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Vitest regression
        run: pnpm exec vitest run --config test/vitest.config.ts test/common/util/group-by.test.ts
      - name: Typecheck
        if: ${{ !cancelled() && success() }}
        run: pnpm run lint:types
